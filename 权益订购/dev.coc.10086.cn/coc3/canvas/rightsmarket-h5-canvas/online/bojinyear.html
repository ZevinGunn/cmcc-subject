    <script type="module">
      import init, {
        Wheel,
      } from "https://res.coc.10086.cn/res/cdn/coc1-online/fixedPath/coc3/WASM/wheel-0.0.8.js";
      const WASM_URL =
        "https://res.coc.10086.cn/res/cdn/coc1-online/fixedPath/coc3/WASM/wheel_bg-0.0.8.wasm";

      function fetchWasmByXHR(url) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.responseType = "arraybuffer";

          xhr.onload = () => {
            if (xhr.status === 200) resolve(xhr.response);
            else reject(new Error("XHR failed"));
          };

          xhr.onerror = reject;
          xhr.send();
        });
      }

      // 缓存错误信息到本地的函数
      function cacheWasmError(error, errorType) {
        try {
          const errorInfo = {
            message: error.message,
            stack: error.stack,
            timestamp: Date.now(),
            errorType: errorType,
          };
          // 先获取现有的错误信息
          let existingErrors = [];
          try {
            const storedErrors = localStorage.getItem("wasmInitErrors");
            if (storedErrors) {
              existingErrors = JSON.parse(storedErrors);
            }
          } catch (e) {
            console.warn("[wasm] failed to parse existing errors", e);
          }
          // 添加新的错误信息
          existingErrors.push(errorInfo);
          // 只保留最近的5个错误
          if (existingErrors.length > 5) {
            existingErrors = existingErrors.slice(-5);
          }
          // 保存到本地存储
          localStorage.setItem(
            "wasmInitErrors",
            JSON.stringify(existingErrors)
          );
        } catch (storageError) {
          console.warn("[wasm] failed to cache error info", storageError);
        }
      }

      async function initWasmCompat() {
        try {
          await init({ module_or_path: WASM_URL });
          return;
        } catch (e1) {
          console.warn("[wasm] init with object failed", e1);
          cacheWasmError(e1, "init_with_object");
        }

        try {
          await init(WASM_URL);
          return;
        } catch (e2) {
          console.warn("[wasm] direct init failed", e2);
          cacheWasmError(e2, "direct_init");
        }

        try {
          const res = await fetch(WASM_URL);
          if (!res || !res.ok) {
            throw new Error(
              "Fetch failed: " + (res ? "status " + res.status : "no response")
            );
          }
          const bytes = await res.arrayBuffer();
          await init(bytes);
          return;
        } catch (e3) {
          console.warn("[wasm] clean fetch failed", e3);
          cacheWasmError(e3, "clean_fetch");
        }

        try {
          const bytes = await fetchWasmByXHR(WASM_URL);
          await init(bytes);
          return;
        } catch (e4) {
          console.error("[wasm] all init methods failed", e4);
          window.initWasmFailed = true;
          cacheWasmError(e4, "all_methods_failed");
          throw e4;
        }
      }

      async function main() {
        console.log("[wasm] init start");

        if (!("WebAssembly" in window)) {
          console.error("[wasm] WebAssembly not supported");
          return;
        }
        await initWasmCompat();
        window.Wheel = Wheel;
        console.log("[wasm] init success");
      }

      main();
    </script>
