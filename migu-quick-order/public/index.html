<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>业务快速订购</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="topbar">
          <select id="productSelect" aria-label="业务"></select>
          <button id="configBtn" class="icon-btn" title="配置">⚙</button>
          <button id="toolsBtn" class="icon-btn" title="解析">⌘</button>
        </div>

        <div class="phone-pill" id="loginState">
          <span id="loginStateText">未登录</span>
          <button id="logoutBtn" class="link-btn hidden" type="button">退出登录</button>
        </div>

        <section class="order-panel">
          <h1 id="productName">咪咕视频会员年包合约</h1>
          <p id="productSummary">0元/年，立即生效，有效期12个月。</p>

          <div class="status-grid">
            <div>
              <span>活动</span>
              <strong id="marketStatus">待检测</strong>
            </div>
            <div>
              <span>商品</span>
              <strong id="productStatus">待查询</strong>
            </div>
          </div>
          <button id="networkBtn" class="secondary">网络诊断</button>

          <div class="step-box" id="loginForm">
            <label>手机号码</label>
            <div class="row">
              <input id="phone" inputmode="numeric" maxlength="11" placeholder="请输入北京移动手机号" />
              <button id="sendLoginCode">验证码</button>
            </div>
            <label>登录验证码</label>
            <div class="row">
              <input id="loginCode" inputmode="numeric" maxlength="8" placeholder="短信验证码" />
              <button id="loginBtn">登录</button>
            </div>
          </div>

          <div class="confirm-box" id="confirmInfo">
            <div class="confirm-title">订购确认</div>
            <div class="confirm-html" id="confirmHtml">登录后查询业务确认信息</div>
          </div>

          <div class="step-box">
            <label>订购验证码</label>
            <div class="row">
              <input id="orderCode" inputmode="numeric" maxlength="8" placeholder="确认订购短信验证码" />
              <button id="sendOrderCode">获取</button>
            </div>
            <button id="orderBtn" class="primary">确认订购</button>
          </div>
        </section>
      </section>

      <section class="result-band">
        <h2>执行结果</h2>
        <pre id="resultLog">等待操作...</pre>
      </section>
    </main>

    <dialog id="configDialog">
      <form method="dialog" class="dialog-body">
        <div class="dialog-head">
          <h2>后台配置</h2>
          <button value="cancel" class="icon-btn">×</button>
        </div>
        <textarea id="configText" spellcheck="false"></textarea>
        <div class="dialog-actions">
          <button id="addTemplate" value="none" type="button">新增模板</button>
          <button id="saveConfig" value="none" type="button" class="primary">保存配置</button>
        </div>
      </form>
    </dialog>

    <dialog id="toolsDialog">
      <form method="dialog" class="dialog-body">
        <div class="dialog-head">
          <h2>加密与解析</h2>
          <button value="cancel" class="icon-btn">×</button>
        </div>
        <div class="tool-grid">
          <section>
            <label>明文 JSON</label>
            <textarea id="plainText" spellcheck="false"></textarea>
            <button id="encryptBtn" value="none" type="button" class="primary">加密入参</button>
          </section>
          <section>
            <label>encipherParam / 返回内容</label>
            <textarea id="cipherText" spellcheck="false"></textarea>
            <button id="parseBtn" value="none" type="button">解析</button>
          </section>
        </div>
        <pre id="toolResult">RSA 公钥只能加密，不能解密已有密文；如需解密必须提供私钥。</pre>
      </form>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
