<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>北京移动合约查询</title>
  <link rel="stylesheet" href="/styles.css?v=20261106-6">
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <span class="brand-mark" aria-hidden="true">合</span>
      <div>
        <h1>北京移动合约查询</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="summary" aria-live="polite">
        <span><strong id="result-count">-</strong> 条结果</span>
        <span><strong id="total-count">-</strong> 条当前数据</span>
      </div>
      <a class="service-link" href="https://arpu.1008086.xyz/">ARPU 查询 <span aria-hidden="true">&rarr;</span></a>
    </div>
  </header>

  <main>
    <div class="dataset-tabs" role="tablist" aria-label="合约数据类型">
      <button class="dataset-tab" type="button" role="tab" data-type="2" aria-selected="true">
        二类合约 <span data-count="2">-</span>
      </button>
      <button class="dataset-tab" type="button" role="tab" data-type="3" aria-selected="false">
        三类合约 <span data-count="3">-</span>
      </button>
      <button class="dataset-tab" type="button" role="tab" data-type="low" aria-selected="false">
        低消方案等级 <span data-count="low">-</span>
      </button>
      <button class="dataset-tab" type="button" role="tab" data-type="grid" aria-selected="false">
        业务大全 <span data-count="grid">-</span>
      </button>
      <button class="dataset-tab" type="button" role="tab" data-type="tariff" aria-selected="false">
        资费快捷查询 <span data-count="tariff">-</span>
      </button>
    </div>

    <section id="comparison" class="comparison" aria-label="版本对比">
      <div class="view-tabs" role="group" aria-label="数据范围">
        <button type="button" data-view="current" aria-pressed="true">当前清单 <span></span></button>
        <button type="button" data-view="added" aria-pressed="false">更新区（新增） <span></span></button>
        <button type="button" data-view="removed" aria-pressed="false">删减区 <span></span></button>
        <button type="button" data-view="changed" aria-pressed="false">内容变更 <span></span></button>
      </div>
    </section>

    <form id="filters" class="toolbar" role="search">
      <label class="search-field">
        <span class="sr-only">搜索当前数据</span>
        <input id="query" name="q" type="search" placeholder="搜索合约编码、名称或关键词" autocomplete="off">
      </label>
      <button id="advanced-toggle" class="button secondary advanced-toggle" type="button" aria-expanded="false">高级筛选</button>
      <button id="reset" class="button secondary" type="button">重置</button>
      <button id="export" class="button primary" type="button">导出 CSV</button>
      <div id="advanced-filters" class="advanced-filters" aria-label="高级筛选">
        <div class="advanced-filters-heading">
          <span>高级筛选</span>
          <button id="advanced-close" class="advanced-close" type="button" aria-label="收起高级筛选">收起</button>
        </div>
        <div class="advanced-filters-grid">
          <label id="primary-filter-wrap">
            <span id="primary-filter-label" class="field-label">ID 前缀</span>
            <select id="primary-filter"></select>
          </label>
          <label id="secondary-filter-wrap">
            <span id="secondary-filter-label" class="field-label">分类</span>
            <select id="secondary-filter"></select>
          </label>
          <label>
            <span class="field-label">每页</span>
            <select id="page-size" name="pageSize">
              <option value="25">25 条</option>
              <option value="50" selected>50 条</option>
              <option value="100">100 条</option>
              <option value="200">200 条</option>
            </select>
          </label>
          <fieldset id="price-filters" class="price-filters">
            <legend class="sr-only">价格筛选和排序</legend>
            <label>
              <span class="field-label">最低价格（元）</span>
              <input id="min-price" name="minPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="不限">
            </label>
            <label>
              <span class="field-label">最高价格（元）</span>
              <input id="max-price" name="maxPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="不限">
            </label>
            <label class="price-sort-field">
              <span class="field-label">价格排序</span>
              <select id="price-sort" name="sort">
                <option value="">默认顺序</option>
                <option value="price-asc">价格从低到高</option>
                <option value="price-desc">价格从高到低</option>
              </select>
            </label>
          </fieldset>
        </div>
      </div>
    </form>

    <section id="grid-admin" class="grid-admin" hidden aria-hidden="true">
      <input id="grid-admin-key" type="hidden"><input id="grid-admin-ids" type="hidden">
      <button id="grid-configure" type="button" hidden></button><button id="grid-collect-all" type="button" hidden></button><button id="grid-discover" type="button" hidden></button>
      <span id="grid-admin-status" hidden></span>
    </section>

    <div id="grid-mode-bar" class="grid-mode-bar" hidden>
      <button id="grid-list-mode" class="mode-link" type="button" aria-pressed="true">业务大全</button>
      <button id="grid-knowledge-mode" class="mode-link" type="button" aria-pressed="false">知识库查询</button>
      <a href="/api/grid-catalog/export.json">导出 JSON</a>
      <a href="/api/grid-catalog/export.xlsx">导出 Excel</a>
    </div>
    <button id="advanced-backdrop" class="advanced-backdrop" type="button" aria-label="关闭高级筛选" hidden></button>

    <section id="knowledge-panel" class="knowledge-panel" hidden aria-label="网格通知识库">
      <div class="knowledge-heading">
        <div>
          <h2>网格通知识库</h2>
          <p>搜索业务介绍、业务规则和资费表内容；详情按需加载。</p>
        </div>
        <span id="knowledge-summary" class="knowledge-summary" role="status" aria-live="polite">共 - 条入口</span>
      </div>
      <div class="knowledge-filters">
        <label class="knowledge-search">
          <span class="field-label">搜索知识内容</span>
          <input id="knowledge-query" type="search" placeholder="业务 ID、名称、介绍、规则或资费关键词" autocomplete="off">
        </label>
        <label>
          <span class="field-label">采集状态</span>
          <select id="knowledge-status">
            <option value="">全部状态</option>
            <option value="ok">已采集</option>
            <option value="partial">部分内容</option>
            <option value="unavailable">不可用</option>
          </select>
        </label>
        <label>
          <span class="field-label">每页</span>
          <select id="knowledge-page-size">
            <option value="20" selected>20 条</option>
            <option value="40">40 条</option>
            <option value="80">80 条</option>
          </select>
        </label>
        <button id="knowledge-reset" class="button secondary" type="button">重置</button>
      </div>
      <div id="knowledge-results" class="knowledge-results" aria-live="polite"></div>
      <div id="knowledge-empty" class="knowledge-empty" hidden>没有匹配的知识内容</div>
      <div id="knowledge-loading" class="knowledge-loading" hidden>正在查询知识库…</div>
      <nav class="knowledge-pagination" aria-label="知识库结果分页">
        <button id="knowledge-previous" class="icon-button" type="button" aria-label="上一页">&lsaquo;</button>
        <span id="knowledge-page-range">-</span>
        <button id="knowledge-next" class="icon-button" type="button" aria-label="下一页">&rsaquo;</button>
      </nav>
    </section>

    <div id="knowledge-detail" class="knowledge-detail" hidden>
      <button id="knowledge-detail-backdrop" class="knowledge-detail-backdrop" type="button" aria-label="关闭详情"></button>
      <aside class="knowledge-detail-card" role="dialog" aria-modal="true" aria-labelledby="knowledge-detail-title">
        <div class="knowledge-detail-header">
          <div>
            <span id="knowledge-detail-id" class="knowledge-detail-id"></span>
            <h2 id="knowledge-detail-title">业务知识详情</h2>
          </div>
          <button id="knowledge-detail-close" class="icon-button" type="button" aria-label="关闭详情">&times;</button>
        </div>
        <div id="knowledge-detail-body" class="knowledge-detail-body"></div>
      </aside>
    </div>

    <section class="table-region" aria-labelledby="table-title">
      <div class="table-heading">
        <div class="table-title-group">
          <h2 id="table-title">合约清单</h2>
          <span id="filtered-total" role="status" aria-live="polite">共 - 条</span>
        </div>
        <span id="page-status">第 - 页</span>
      </div>
      <div class="table-scroll" id="results-panel" role="tabpanel" aria-label="查询结果">
        <table id="results-table">
          <thead><tr id="table-headers"></tr></thead>
          <tbody id="results"></tbody>
        </table>
        <div id="empty" class="empty" hidden>没有匹配的记录</div>
        <div id="loading" class="loading">正在加载</div>
      </div>
      <nav class="pagination" aria-label="结果分页">
        <button id="previous" class="icon-button" type="button" title="上一页" aria-label="上一页">&lsaquo;</button>
        <span id="page-range">-</span>
        <button id="next" class="icon-button" type="button" title="下一页" aria-label="下一页">&rsaquo;</button>
      </nav>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js?v=20261106-6" defer></script>
</body>
</html>
