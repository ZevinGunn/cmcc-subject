# Keep application-generated 4xx/5xx responses untouched. These handlers run
# only when Nginx itself cannot connect to or receive a valid response from the
# local application.
proxy_intercept_errors off;
error_page 502 = @cmcc_gateway_502;
error_page 503 = @cmcc_gateway_503;
error_page 504 = @cmcc_gateway_504;

location @cmcc_gateway_502 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Gateway-Error "origin-unreachable" always;
    add_header X-Request-ID $request_id always;
    add_header Retry-After "3" always;
    return 502 '{"ok":false,"error":"BAD_GATEWAY","message":"Local application is unavailable","requestId":"$request_id"}';
}

location @cmcc_gateway_503 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Gateway-Error "origin-unavailable" always;
    add_header X-Request-ID $request_id always;
    add_header Retry-After "3" always;
    return 503 '{"ok":false,"error":"SERVICE_UNAVAILABLE","message":"Local application is temporarily unavailable","requestId":"$request_id"}';
}

location @cmcc_gateway_504 {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Gateway-Error "origin-timeout" always;
    add_header X-Request-ID $request_id always;
    add_header Retry-After "3" always;
    return 504 '{"ok":false,"error":"GATEWAY_TIMEOUT","message":"Local application timed out","requestId":"$request_id"}';
}
