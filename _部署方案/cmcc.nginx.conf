# /opt/homebrew/etc/nginx/servers/cmcc.conf   (Apple Silicon)
# /usr/local/etc/nginx/servers/cmcc.conf      (Intel)
# This file is included from nginx.conf's http {} block.
# Replace /Users/CHANGE_ME before installing it.

# Cloudflare Tunnel connects locally. Only expose the gateway on loopback so
# CF-Connecting-IP and X-Forwarded-Proto cannot be spoofed by LAN clients.
map $http_cf_connecting_ip $cmcc_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $cmcc_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $cmcc_connection_upgrade {
    default upgrade;
    ""      "";
}

# Do not log query strings: several applications carry sensitive parameters.
log_format cmcc_timing '$time_iso8601 request_id=$request_id host=$host '
                       'method=$request_method uri=$uri status=$status '
                       'request_time=$request_time upstream_time=$upstream_response_time '
                       'upstream_status=$upstream_status bytes=$body_bytes_sent';
access_log /opt/homebrew/var/log/nginx/cmcc-timing.log cmcc_timing buffer=64k flush=5s;

# Compress text responses between Nginx and Cloudflare. Cloudflare may then
# transcode them to Brotli for the browser.
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

etag on;
tcp_nopush on;
open_file_cache max=4096 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;
open_file_cache_errors off;

# Keep small API responses in memory. Disk buffering remains disabled so a
# proxy_temp permission issue cannot turn a large response into a 502.
proxy_buffering on;
proxy_request_buffering off;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 64k;
proxy_max_temp_file_size 0;
proxy_connect_timeout 3s;
proxy_read_timeout 180s;
proxy_send_timeout 180s;
proxy_socket_keepalive on;
proxy_intercept_errors off;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $cmcc_client_ip;
proxy_set_header X-Forwarded-For   $cmcc_client_ip;
proxy_set_header X-Forwarded-Proto $cmcc_forwarded_proto;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Connection        "";
proxy_hide_header X-Powered-By;

upstream cmcc_cookie_app       { server 127.0.0.1:3101; keepalive 16; }
upstream cmcc_rights_backend   { server 127.0.0.1:3010; keepalive 16; }
upstream cmcc_arpu_proxy       { server 127.0.0.1:3000; keepalive 16; }
upstream cmcc_qqtlocal         { server 127.0.0.1:8899; keepalive 16; }
upstream cmcc_notice           { server 127.0.0.1:3111; keepalive 16; }
upstream cmcc_qqt_backend      { server 127.0.0.1:7607; keepalive 16; }
upstream cmcc_bmcc_backend     { server 127.0.0.1:8788; keepalive 16; }
upstream cmcc_bjcmcc_backend   { server 127.0.0.1:8790; keepalive 16; }
upstream cmcc_contract3        { server 127.0.0.1:3002; keepalive 16; }
upstream cmcc_tools_workbench  { server 127.0.0.1:4177; keepalive 16; }
upstream cmcc_project_manager  { server 127.0.0.1:7800; keepalive 8; }

server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    return 404;
}

# ============== 1. home.1008086.xyz (cookie-app) ==============
server {
    listen 127.0.0.1:80;
    server_name home.1008086.xyz;

    root /Users/CHANGE_ME/CMCC-PROJECT/免登录进入全球通/cookie-app/dist;
    index index.html;
    client_max_body_size 25m;

    include /Users/CHANGE_ME/CMCC-PROJECT/_部署方案/nginx-gateway-errors.conf;

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
    location /api/   { proxy_pass http://cmcc_cookie_app; }
    location /debug/ { proxy_pass http://cmcc_cookie_app; }

    location = /wed-puzzle { return 302 /wed-puzzle/; }
    location ^~ /wed-puzzle/ {
        proxy_pass http://127.0.0.1:4186;
        proxy_set_header Host home.1008086.xyz;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }
}

