<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>参数加解密工具</title>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+SC:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="background"></div>
    <main class="shell">
      <header class="hero">
        <div class="hero-text">
          <h1>参数加解密工具</h1>
          <p class="subtitle">用于前端请求与后端响应的 AES 加解密。</p>
        </div>
      </header>

      <section class="panel tool-panel">
        <div class="tool-header">
          <div>
            <h2>加解密操作</h2>
            <div class="tool-sub">
              支持前端请求参数与后端响应内容的加密/解密，并提供 JSON 格式化。
            </div>
          </div>
          <div class="tool-actions">
            <button class="ghost" id="tool-format" type="button">JSON 格式化</button>
          </div>
        </div>
        <div class="tool-body">
          <div class="tool-col">
            <label>
              <span>输入（明文或密文）</span>
              <textarea id="tool-input" rows="12" placeholder="请输入待处理内容"></textarea>
            </label>
            <div class="tool-buttons">
              <button id="tool-req-encrypt" type="button">前端参数加密</button>
              <button class="ghost" id="tool-req-decrypt" type="button">前端参数解密</button>
              <button id="tool-resp-encrypt" type="button">后端响应加密</button>
              <button class="ghost" id="tool-resp-decrypt" type="button">后端响应解密</button>
            </div>
          </div>
          <div class="tool-col">
            <label>
              <span>输出</span>
              <textarea id="tool-output" rows="12" placeholder="结果输出"></textarea>
            </label>
          </div>
        </div>
      </section>
    </main>
    <div class="float-menu">
      <a class="nav-link" href="/">返回公告列表</a>
    </div>

    <script src="/tools.js"></script>
  </body>
</html>
