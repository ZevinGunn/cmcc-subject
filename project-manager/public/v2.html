<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f3f5f6">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>CMCC 项目运行工作台</title>
    <link rel="stylesheet" href="/v2.css">
  </head>
  <body>
    <main id="app">
      <section class="boot-state" aria-label="正在加载 Project Ops">
        <span class="spinner" aria-hidden="true"></span>
        <p>正在连接运行工作台...</p>
      </section>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-logo" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        <path d="M14 17.5h7M17.5 14v7"></path>
      </symbol>
      <symbol id="icon-dashboard" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="9" rx="1"></rect>
        <rect x="14" y="3" width="7" height="5" rx="1"></rect>
        <rect x="14" y="12" width="7" height="9" rx="1"></rect>
        <rect x="3" y="16" width="7" height="5" rx="1"></rect>
      </symbol>
      <symbol id="icon-server" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="6" rx="2"></rect>
        <rect x="3" y="14" width="18" height="6" rx="2"></rect>
        <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"></path>
      </symbol>
      <symbol id="icon-package" viewBox="0 0 24 24">
        <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path>
        <path d="m4.5 7.7 7.5 4.2 7.5-4.2M12 12v9"></path>
      </symbol>
      <symbol id="icon-operations" viewBox="0 0 24 24">
        <path d="M9 6h11M9 12h11M9 18h11"></path>
        <path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"></path>
      </symbol>
      <symbol id="icon-logs" viewBox="0 0 24 24">
        <path d="M5 3h11l3 3v15H5z"></path>
        <path d="M16 3v4h4M8 11h8M8 15h8M8 19h5"></path>
      </symbol>
      <symbol id="icon-storage" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
        <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
        <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"></path>
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>

      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></symbol>

      <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></symbol>
      <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"></path></symbol>
      <symbol id="icon-restart" viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7"></path></symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"></rect></symbol>
      <symbol id="icon-build" viewBox="0 0 24 24"><path d="m14.7 6.3 3-3a5 5 0 0 1-6.3 6.3L5.7 15.3a2 2 0 1 0 3 3l5.7-5.7a5 5 0 0 1 6.3-6.3l-3 3"></path></symbol>
      <symbol id="icon-rocket" viewBox="0 0 24 24"><path d="M4.5 16.5c-1 1-1.5 3.5-1.5 3.5s2.5-.5 3.5-1.5c.6-.6.6-1.5 0-2s-1.4-.6-2 0Z"></path><path d="m9 15-3-3s2-5 7-8c3-1.8 7-1 7-1s.8 4-1 7c-3 5-8 7-8 7z"></path><circle cx="15" cy="8" r="2"></circle><path d="m9 15-1 5 4-4M9 12l-5 1 4-4"></path></symbol>

      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></symbol>

      <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></symbol>
      <symbol id="icon-cpu" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"></rect><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3M10 10h4v4h-4z"></path></symbol>

      <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 10v7M14 10v7"></path></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 15.5A8 8 0 1 1 8.5 4 7 7 0 0 0 20 15.5Z"></path></symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></symbol>

      <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></symbol>
      <symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a15.7 15.7 0 0 1-2.1 2.8M6.1 6.1C3.8 7.7 2.5 12 2.5 12s3.5 6 9.5 6a9.8 9.8 0 0 0 3.2-.5M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></symbol>
    </svg>

    <script src="/v2.js" defer></script>
  </body>
</html>
