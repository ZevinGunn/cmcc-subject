      var getGBMB = function (meal) {
        //传入的meal是以KB为单位的
        var result = "";
        var own = this;
        var gB;
        var GBMB = { GB: 0, MB: 0, KB: -1, totalMB: 0 };
        gB = meal / 1024 / 1024; //KB转为GB
        GBMB.GB = parseInt(gB); //得到GB部分

        GBMB.MB = parseFloat((gB - GBMB.GB) * 1024).toFixed(2); //得到MB部分
        if (GBMB.MB > 1) {
          GBMB.MB = parseFloat((gB - GBMB.GB) * 1024).toFixed(2); //得到MB部分
        }
        GBMB.totalMB = parseFloat(meal / 1024).toFixed(2); //得到总的MB
        if (GBMB.totalMB > 1) {
          GBMB.totalMB = parseFloat(meal / 1024).toFixed(2); //得到总的MB
        }
        if (meal >= 1024) {
          //>=1MB
          if (GBMB.GB > 0 || GBMB.MB > 0) {
            if (GBMB.GB > 0) {
              result = GBMB.GB + "GB";
            }
            if (GBMB.MB > 0) {
              var aa = GBMB.MB.toString();
              if (aa.substring(aa.indexOf(".")) == ".00") {
                GBMB.MB = aa.substring(0, aa.indexOf("."));
              }
              result += GBMB.MB + "MB";
            }
            GBMB.data = result;
          } else {
            GBMB.data = "0.00" + "MB";
          }
        } else {
          //<1MB,以KB展示
          GBMB.data = meal + "KB";
          GBMB.KB = meal;
        }

        return GBMB;
      };
