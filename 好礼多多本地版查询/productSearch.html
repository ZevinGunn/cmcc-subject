els.q.addEventListener('input', debounce(render));
[els.category, els.prefix, els.long, els.status].forEach(el => el.addEventListener('change', render));
els.reset.addEventListener('click', () => { els.q.value=''; els.category.value=''; els.prefix.value=''; els.long.value=''; els.status.value=''; render(); els.q.focus(); });
els.csv.addEventListener('click', () => {
  const rows = currentRows();
  const header = ['序号','合约编码','编码前缀','合约名称','合约分类','金额档位','合约期(月)','生效时间','失效时间','长期有效','数据状态'];
  const csv = [header, ...rows.map(r => [r.idx,r.code,r.prefix,r.name,r.category,r.amount,r.duration,r.start,r.end,r.long,r.status])]
    .map(line => line.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '二类合约查询结果.csv'; a.click(); URL.revokeObjectURL(a.href);
});
const urlQ = new URLSearchParams(location.search).get('q');
if (urlQ) els.q.value = urlQ;
render();
</script>
</body>
</html>
