services:
  postgres:
    image: postgres:16-alpine
    container_name: cmcc-cookie-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmcc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cmcc_cookie_app}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmcc_user} -d ${POSTGRES_DB:-cmcc_cookie_app}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
